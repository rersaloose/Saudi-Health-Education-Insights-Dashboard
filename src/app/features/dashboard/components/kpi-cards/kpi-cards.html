<div class="kpi-grid">
  @for (card of cards(); track card.label) {
    <app-card-state
      [loading]="card.loading()"
      [hasData]="card.hasData()"
      [hasError]="card.hasError()"
    >
      <div class="kpi-card" [class]="card.cssClass">
        <div class="kpi-content">
          <div class="kpi-label">
            {{ card.label }}
          </div>

          <div class="kpi-value" [class]="card.valueClass">
            {{ card.value }}

            @if (card.badge) {
              <span class="kpi-badge">
                {{ card.badge }}
              </span>
            }
          </div>

          <div class="kpi-sub">
            {{ card.sub }}
          </div>
        </div>

        <div class="kpi-icon">
          <img [src]="card.icon" [alt]="card.label" />
        </div>
      </div>
    </app-card-state>
  }
</div>
