<section class="card campus-card">
  <div class="card-header-row">
    <h2 class="section-title">{{ 'CARD.campusEnrollment' | translate }}</h2>
    @if (hasData()) {
      <div class="year-badge">{{ studentComponentServices.selectedYear() }}</div>
    }
  </div>
  <app-card-state [loading]="loading()" [hasData]="hasData()" [hasError]="hasError()">
    <div class="campus-layout">
      <div class="campus-bars">
        <div class="campus-selector-row">
          <span class="field-label">{{ 'CAMPUSES.LABEL' | translate }}</span>
          <select
            class="select-sm"
            [ngModel]="selectedCampus()"
            (ngModelChange)="selectedCampus.set($event)"
          >
            @for (entry of campusOptions; track entry.key) {
              <option [value]="entry.key">{{ entry.label | translate }}</option>
            }
          </select>
        </div>

        @for (campus of campusList(); track campus.key) {
          <div class="campus-bar-row">
            <span class="campus-bar-label" [class.active]="campus.key === selectedCampus()">{{
              campus.label | translate
            }}</span>
            <div class="bar-track">
              <div
                class="bar-fill"
                [style.width.%]="campus.pct"
                [class.active]="campus.key === selectedCampus()"
              ></div>
            </div>
            <span class="bar-value">{{ campus.total | numberFormat }}</span>
          </div>
        }
      </div>

      <div class="campus-chart-wrap">
        <canvas #campusCanvas></canvas>
      </div>
    </div>
  </app-card-state>
</section>
