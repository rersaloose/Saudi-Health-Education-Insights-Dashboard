<section class="card insights-card">
      <div class="card-header-row">
        <h2 class="section-title">Insights &amp; Highlights</h2>
        <span class="insights-count">{{ insights().length }}</span>
      </div>
      <ul class="insights-list">
        @for (item of insights(); track item.text) {
          <li class="insight-item">
            <span class="insight-icon {{ item.icon }}"></span>
            <span class="insight-body" [innerHTML]="item.text"></span>
            @if (item.tag) {
              <span class="insight-tag {{ item.tagClass }}">{{ item.tag }}</span>
            }
          </li>
        }
      </ul>
    </section>
