<section class="card trends-card">
  <h2 class="section-title">{{ 'TRENDS.TITLE' | translate }}</h2>
  <app-card-state [loading]="loading()" [hasData]="hasData()" [hasError]="hasError()">
    <div class="trends-charts">
      <div class="trend-total">
        <canvas #totalCanvas appAutoResize (resized)="onResize()"></canvas>
      </div>
      <div class="trend-gender">
        <div class="legend-row">
          <span class="legend-dot total-dot"></span> {{ 'TRENDS.TOTAL_STUDENTS' | translate }}
          <span class="legend-dot male-dot ml"></span> {{ 'TRENDS.MALE' | translate }}
          <span class="legend-dot female-dot ml"></span> {{ 'TRENDS.FEMALE' | translate }}
        </div>
        <canvas #genderCanvas appAutoResize (resized)="onResize()"></canvas>
      </div>
    </div>
  </app-card-state>
</section>
