 <section class="card trends-card">
      <h2 class="section-title">Student Trends Over Time</h2>
      <div class="trends-charts">
        <div class="trend-total">
          <canvas #totalCanvas></canvas>
        </div>
        <div class="trend-gender">
          <div class="legend-row">
            <span class="legend-dot total-dot"></span>Total Students
            <span class="legend-dot male-dot ml"></span>Male
            <span class="legend-dot female-dot ml"></span>Female
          </div>
          <canvas #genderCanvas></canvas>
        </div>
      </div>
    </section>
