<div class="container-fluid">
  <header class="dashboard-header">
    <div class="header-left">
      <div class="logo-mark">KSAU-HS</div>
      <div class="header-titles">
        <h1>{{ 'HEADER.TITLE' | translate }}</h1>
        <p>{{ 'HEADER.SUBTITLE' | translate }}</p>
      </div>
    </div>

    <div class="header-right">
      <button
        class="theme-toggle"
        (click)="themeServices.toggle()"
        [attr.aria-label]="
          themeServices.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'
        "
      >
        @if (themeServices.theme() === 'dark') {
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
        } @else {
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        }
      </button>
      <select
        class="lang-selector"
        [ngModel]="transServices.currentLang()"
        (change)="onLangChange($event)"
      >
        @for (lang of transServices.availableLangs; track lang.code) {
          <option [value]="lang.code" [ngClass]="{ plex_font: lang.code === 'ar' }">
            {{ lang.label }}
          </option>
        }
      </select>
      <a routerLink="/about" class="nav-link">{{ 'HEADER.ABOUT' | translate }}</a>
      @if (headerSvc.showYearFilter()) {
        <div class="year-selector">
          <select [ngModel]="selectedYear" (ngModelChange)="onYearChange($event)">
            @for (year of years(); track year) {
              <option [value]="year">{{ year }}</option>
            }
          </select>
        </div>
      }
    </div>
  </header>
</div>
